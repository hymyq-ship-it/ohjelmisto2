<!DOCTYPE html>
<html>
<body>
<script>
  const startYear = Number(prompt("Enter start year:"));
  const endYear = Number(prompt("Enter end year:"));

  document.write("<ul>");
  for (let year = startYear; year <= endYear; year++) {
    if ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0) {
      document.write(`<li>${year}</li>`);
    }
  }
  document.write("</ul>");
</script>
</body>
</html>
