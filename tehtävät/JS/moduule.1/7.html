<!DOCTYPE html>
<html>
<body>
<script>
  const rolls = Number(prompt("How many dice to roll?"));
  let sum = 0;

  for (let i = 0; i < rolls; i++) {
    const die = Math.floor(Math.random() * 6) + 1;
    sum += die;
  }

  document.write(`Sum of ${rolls} dice rolls is ${sum}`);
  console.log(`Sum of ${rolls} dice rolls is ${sum}`);
</script>
</body>
</html>
