<!DOCTYPE html>
<html>
<body>
<script>
  const num = Number(prompt("Enter an integer:"));
  let isPrime = true;

  if (num <= 1) {
    isPrime = false;
  } else {
    for (let i = 2; i < num; i++) {
      if (num % i === 0) {
        isPrime = false;
        break;
      }
    }
  }

  if (isPrime) {
    document.write(`${num} is a prime number.`);
  } else {
    document.write(`${num} is not a prime number.`);
  }
</script>
</body>
</html>
