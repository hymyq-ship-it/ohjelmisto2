<!DOCTYPE html>
<html>
<body>
<script>
  const name = prompt("Enter student's name:");
  const houseNum = Math.floor(Math.random() * 4) + 1;

  let house;
  if (houseNum === 1) {
    house = "Gryffindor";
  } else if (houseNum === 2) {
    house = "Slytherin";
  } else if (houseNum === 3) {
    house = "Hufflepuff";
  } else {
    house = "Ravenclaw";
  }

  document.write(`${name}, you are ${house}.`);
</script>
</body>
</html>

Same logic with switch also works:

switch(houseNum) {
  case 1: house = "Gryffindor"; break;
  case 2: house = "Slytherin"; break;
  case 3: house = "Hufflepuff"; break;
  default: house = "Ravenclaw";
}
