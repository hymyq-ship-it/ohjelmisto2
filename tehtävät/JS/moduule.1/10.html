<!DOCTYPE html>
<html>
<body>
<script>
  const numDice = Number(prompt("Enter number of dice:"));
  const targetSum = Number(prompt("Enter sum of interest:"));
  const simulations = 10000;
  let hits = 0;

  for (let i = 0; i < simulations; i++) {
    let sum = 0;
    for (let j = 0; j < numDice; j++) {
      sum += Math.floor(Math.random() * 6) + 1;
    }
    if (sum === targetSum) {
      hits++;
    }
  }

  const probability = (hits / simulations) * 100;
  document.write(`Probability to get sum ${targetSum} with ${numDice} dice is ${probability.toFixed(2)}%`);
</script>
</body>
</html>
