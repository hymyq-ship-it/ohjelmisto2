<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tehtävä 1</title>
</head>
<body>
  <h1>Tehtävä 1 - Numbers in reverse order</h1>
  <p>Katso tulokset konsolista (F12 -&gt; Console)</p>

  <script>
    'use strict';
    const numbers = [];
    for (let i = 0; i < 5; i++) {
      const num = Number(prompt(`Enter number ${i + 1}:`));
      numbers.push(num);
    }
    console.log('Numbers in reverse order:');
    for (let i = numbers.length - 1; i >= 0; i--) {
      console.log(numbers[i]);
    }
  </script>
</body>
</html>
