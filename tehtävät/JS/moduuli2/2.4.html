<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tehtävä 4</title>
</head>
<body>
  <h1>Tehtävä 4</h1>
  <p>Katso tulokset konsolista (F12 -&gt; Console)</p>

  <script>
    'use strict';
    const numbers = [];
    let num;
    do {
      num = Number(prompt('Enter a number (0 stops):'));
      if (num !== 0) numbers.push(num);
    } while (num !== 0);

    numbers.sort((a, b) => b - a);
    console.log('Numbers from largest to smallest:');
    for (const n of numbers) {
      console.log(n);
    }
  </script>
</body>
</html>
